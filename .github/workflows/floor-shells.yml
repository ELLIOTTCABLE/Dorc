# The two-binary floor's shells — the OFFICIAL dash 0.5.12 and posh 0.14.1 releases, never a
# distribution's patched build — compiled static, and published as a pre-release that is plainly
# test tooling rather than a Dorc release, sources attached (posh is GPL-2).
name: floor-shells

on:
  # Meant to follow each semver-minor Dorc release; until one exists, a pull request that edits
  # this workflow runs it.
  pull_request:
    paths: [.github/workflows/floor-shells.yml]

permissions:
  contents: read

concurrency:
  group: floor-shells

env:
  TAG: floor-shells-dash-0.5.12-posh-0.14.1

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      # musl, so one static binary runs on any Linux, WSL included, whatever its libc.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools autoconf automake
      # Debian's pool serves dash's upstream release tarball byte for byte (upstream's own host
      # speaks only plain HTTP), and Debian is posh's upstream; the digests are what make either
      # host trustworthy.
      - run: |
          curl -fsSLO https://deb.debian.org/debian/pool/main/d/dash/dash_0.5.12.orig.tar.gz
          curl -fsSLO https://deb.debian.org/debian/pool/main/p/posh/posh_0.14.1.tar.xz
          sha256sum -c <<'EOF'
          6a474ac46e8b0b32916c4c60df694c82058d3297d8b385b74508030ca4a8f28a  dash_0.5.12.orig.tar.gz
          3584292529b0d8274ccc76adf1acefcca8ad9a1a5d7d7448f099c129401ffa3c  posh_0.14.1.tar.xz
          EOF
      - run: |
          tar -xzf dash_0.5.12.orig.tar.gz
          cd dash-0.5.12
          ./configure CC=musl-gcc --enable-static
          make
      # posh's generated autotools files predate its own acinclude.m4, so they are regenerated, the
      # way Debian (posh's upstream) always builds it.
      - run: |
          tar -xJf posh_0.14.1.tar.xz
          cd posh-0.14.1
          autoreconf -fi
          ./configure CC=musl-gcc LDFLAGS=-static
          make
      - run: |
          mkdir -p floor/bin
          cp dash-0.5.12/src/dash posh-0.14.1/posh floor/bin/
          strip floor/bin/dash floor/bin/posh
          file floor/bin/dash floor/bin/posh
          floor/bin/dash -c 'echo dash runs'
          floor/bin/posh -c 'echo posh runs'
          tar -czf "floor-shells-${{ matrix.platform }}.tar.gz" -C floor bin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floor-shells-${{ matrix.platform }}
          path: floor-shells-${{ matrix.platform }}.tar.gz
      - if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floor-shells-sources
          path: |
            dash_0.5.12.orig.tar.gz
            posh_0.14.1.tar.xz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: floor-shells-*
          merge-multiple: true
      - run: sha256sum floor-shells-*.tar.gz dash_0.5.12.orig.tar.gz posh_0.14.1.tar.xz > SHA256SUMS
      # No `--target`: the tag lands on the default branch. Pointed at a commit that adds workflow
      # files, it is a ref this token may not create, and GitHub answers that with a bare 500.
      - run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false --notes "" \
              --title "Floor shells: dash 0.5.12, posh 0.14.1 (test tooling, not a Dorc release)"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            floor-shells-*.tar.gz dash_0.5.12.orig.tar.gz posh_0.14.1.tar.xz SHA256SUMS
