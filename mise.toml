# Toolchain pin for Dorc tooling.
#
# Win/WSL note: this file is read by BOTH your Windows-side and WSL-side mise
# (it's in the synced tree), but installs are per-platform — run `mise install`
# on each side. The corpus instrument's npm deps are pure-JS/wasm (no native
# bindings), so the committed package-lock survives that division.
#
# node is LTS (the kept corpus instrument lives under tools/corpus/). The wasm
# scanner stack is node-version-agnostic; verified on 25, pinned to 22 LTS.
#
# INVIOLABLE INVARIANT: This file *must* be verified, falsifiably. Do not modify
# it without *verifying that you aren't silencing failures*. Test in both
# directions - manufacture changes that trip the failure-modes, and ensure the
# tooling blocks.

[tools]
node = "22"

# clone-vendor.sh deps
gh = "2"
jq = "1"

# Pre-commit `cargo fmt` for the Rust spike under spike/ (see ./hk.pkl).
# `pkl` is hk's config backend; both are pinned here so the hook is
# reproducible rather than relying on a machine-global mise install.
#
# NOTE: the git hook is deliberately NOT auto-installed. This worktree's
# `.git` shares the MAIN repo's gitdir, so `hk install` would write the
# `hook.*` entry into the SHARED `.git/config` (affecting `main` and every
# worktree). Install is a manual, human-gated step — see the round-19 spike
# note. Run `mise run hk-install` only with that tradeoff understood.
#
# FLOOR 1.47.0: earlier hk vendors a libgit2 that rejects `extensions.relativeWorktrees`
# — which the worktree fleet needs — and cannot open this repository at all. Never pin
# below it. `HK_LIBGIT2=0` forces hk's shell-git path if a libgit2 problem recurs.
hk = "1.53.0"
pkl = "0.31.1"

# Lint/audit toolbelt for the spike (wired as hk.pkl steps; see also
# `mise run audit` for the network-touching advisories pass).
"cargo:cargo-deny" = "latest"
typos = "latest"

# The `mise run test` runner. Pinned looser than the lanes above but tighter than the
# toolbelt, because the whole suite rides it.
#
# DANGER: nextest runs ZERO doctests, and this workspace has 12 — one of them the
# `compile_fail` doctest in `aid/src/narrative.rs` that holds the narrative seal shut
# ACROSS the crate seam. `mise run test` therefore pairs it with `cargo test --doc` and
# that second step is not optional; a bare `cargo nextest run` is green with the seal
# gone. Reach for the task, never the tool.
"cargo:cargo-nextest" = "0.9"

# Opt-in `dorc lint` real-external-tools test lane ONLY (human-authorized 2026-07-18;
# spike/CLAUDE.md `real-tools-lane-opt-in`, `Research/notes/27T`). Pinned EXACT so the lane's
# live-fire is reproducible. shellcheck is INERT for every default gate/suite: the default
# `sh e2e/run.sh` lint-cases scrub PATH to an empty dir and the unit tier runs a fake runner,
# so nothing spawns it unless `DORC_E2E_REAL_TOOLS` opts in. It does not touch the rust
# toolchain or any existing gate. (checkbashisms is a Debian perl script absent from every mise
# backend — the lane provisions it out-of-band into the git-ignored `spike/e2e/.real-tools/`.)
shellcheck = "0.11.0"

# Lean 4, for the sparing-algebra formalization under
# .claude/research/refinement-types-industrial-cost/spike-lean-sparing/. The registry has
# no lean/elan entry, so ubi installs elan (the ecosystem's rustup-alike) from the
# official releases; the [env] block below gives it a home outside the repo tree and
# puts its proxy binaries (lean/lake) on PATH. The LEAN version is pinned where the
# ecosystem expects it — the spike's `lean-toolchain` file — and elan fetches it on
# first `lake build`. (A direct `ubi:leanprover/lean4` pin was tried first and fails
# native-Windows bin-path detection; see the spike's REPORT.md.)
"ubi:leanprover/elan" = { version = "4.2.3", exe = "elan-init" }

# Kani, the bounded model checker behind the `verify:kani` lane. LINUX/WSL ONLY (upstream
# publishes no Windows asset), so `os` gates it rather than letting a Windows `mise install`
# fail. The pin is ADDITIVE — this crate is only the small downloader shim that provides
# `cargo-kani`, and it shadows no toolchain — so it roots, like elan, rather than nesting the
# way the aeneas lane's rustc-shadowing pin must.
#
# The shim alone verifies nothing: `mise run verify:kani-setup` fetches Kani's own engine
# bundle (CBMC and the kani-compiler, ~1GB) into `~/.kani`, and installs the nightly that
# compiler was linked against through rustup. Both are Kani's own homes; it offers no env
# redirect for either. Absent that setup, `verify:kani` refuses loudly and names the task.
"cargo:kani-verifier" = { version = "0.67.0", os = ["linux"] }

[env]
# elan's toolchain store: mise-adjacent user-local state, deliberately OUTSIDE the
# repo/Sync tree (toolchains are ~1GB of churn no sync or backup should see).
ELAN_HOME = "{{xdg_data_home}}/elan"
_.path = ["{{xdg_data_home}}/elan/bin"]
# Route hk's hook invocation + step commands through mise, so `cargo`/`typos`/`cargo-deny`
# resolve inside a step without an activated shell. This is WHY no step in hk.pkl spells
# `mise x --`: hk resolves the mise environment per step itself, and the prefix only bought a
# nested mise process per step. It is load-bearing for the git-hook path, which is why
# `mise run hk-install` installs with `--mise` (that wrapper is what makes this var reach hk
# for a contributor who has never activated mise in their shell).
HK_MISE = "1"

# Cargo's target dir, spelled ONCE and resolved per-leg. On Windows and on a real *nix host
# this is exactly cargo's own default, so nothing moves. Inside WSL it moves off drvfs, which
# is `wsl-unix-leg-at-fold`'s standing requirement made automatic: a native-Linux cargo and a
# Windows cargo sharing one `spike/target/` clobber each other's artifacts, and the WSL leg of
# `mise run both` had no such redirect until now — the whole reason folds were being run as two
# hand-spelled legs. Per-WORKTREE-suffixed because concurrent lanes must not share one either.
#
# `{{config_root}}` is the worktree root (this file's directory), so the suffix names the lane
# without anyone having to invent one; `spike/` is the cargo workspace root, hence the default's
# shape. Anything reading build output must honour this var rather than re-deriving
# `spike/target` — `internal_tooling::target_dir()` is that seat.
CARGO_TARGET_DIR = "{% if env.WSL_DISTRO_NAME %}{{ xdg_cache_home }}/dorc-wsl-target-{{ config_root | split(pat='/') | last }}{% else %}{{ config_root }}/spike/target{% endif %}"

# ── Tasks ───────────────────────────────────────────────────────────────────
# `mise run <name>` works from ANYWHERE in the tree: `dir` resolves against this
# file, not your cwd. `mise tasks` lists them. Trailing args after `--` are
# appended to the task's LAST command, so `mise run test:e2e -- <substring>`
# filters trials by case name.
#
# PORTABILITY CONTRACT for anyone adding a task: mise pipes an inline `run`
# string through `sh -c` on *nix but `cmd /c` on Windows, so a task body must
# carry NO shell syntax — no `&&`, no `$VAR`/`%VAR%`, no `VAR=x cmd` prefix, no
# redirects, no globs, no quoted paths-with-spaces. Instead use `dir` for cwd,
# `[tasks.x.env]` for variables, a `run` ARRAY for sequencing (sequential and
# fail-fast), and a nested `mise run <other>` to compose tasks whose `dir`s
# differ.
#
# NO `sh <script>` EITHER. Git for Windows bundles `sh`/`sed`/`awk` but does not
# put them on PATH, so such a task dies with `'sh' is not recognized` from native
# PowerShell/cmd. Anything that wanted a script goes in `crates/internal-tooling`
# — the repo's cargo-xtask-pattern tooling crate, NOT product code — spelled
# `cargo run -q -p internal-tooling -- <task>`. That crate also owns the ONE
# answer to "where is a POSIX shell", shared with the e2e corpus so the two
# cannot drift. (Only git HOOKS still get a POSIX environment for free, because
# git supplies it before hk/mise are involved — see hk.pkl.)
#
# Do NOT "fix" a missing shell by putting git's `usr/bin` on PATH. It holds 249
# binaries including `link.exe`, `find`, `sort`, `tar`: PATH is directory-granular
# while the hazards are name-granular, so you cannot take git's `sh` without also
# putting git's `link.exe` ahead of MSVC's. And `bash` on native Windows is
# `%SystemRoot%\System32\bash.exe` — the WSL launcher, which will run Linux
# binaries against Linux paths without a word. Resolve interpreters by absolute
# path; never by PATH order.
#
# (Trap that bit during this work: on Windows the variable is `Path`, not `PATH`,
# so mise's `{{env.PATH}}` — the only spelling in anyone's muscle memory — fails
# outright. One more reason nothing here templates PATH.)
#
# FAILURE-VISIBILITY CONTRACT: EVERY task here carries `raw = true`, and a new one
# joins them. Uniform rather than decided per task, because the question that would
# decide it — does this tool write its diagnostics to stdout or to stderr? — is
# knowledge about somebody else's tool, and an author who guesses it wrong loses
# their failures SILENTLY.
#
# `MISE_TASK_OUTPUT` configures mise ITSELF, so an exported value —
# agent sessions carry `timed` — beats a `[tasks.*.env]` override and the root
# `[env]` alike, and `timed` is a per-LINE DWELL filter: it discards every stdout
# line another supersedes inside a second, the last one before exit included.
# Measured across every lever, 2026-08-16: task env NO · root `[env]` NO ·
# `[settings] raw` NO (a project config does not carry that one; it resolves
# false) · `[task_config] raw` an unknown field · task-level `raw = true` YES ·
# `MISE_RAW=1` in mise's own env YES · `--raw`/`--output` bind only the level they
# are typed at, and a nested `mise run` is re-captured by its parent, so a
# composed fix has to be spelled on the task that OWNS the stream. stderr is never
# filtered — which is why nextest survives and libtest, the doctests, and every
# `println!` tool (`preflight`, `bless`, `doctor`) do not.
# ────────────────────────────────────────────────────────────────────────────

[tasks.hello]
description = "First run in a fresh clone: install the pinned toolchain, then configure this repo's git hooks. Idempotent — safe to re-run after a pull that moves a pin. Needs `mise trust` to have happened first, which is the one step a task cannot do for you."
raw = true
# `mise install` is spelled out rather than left implicit: mise installs on demand by default, but
# that path is exactly what a `not_found_auto_install=false` / `MISE_NOT_FOUND_AUTO_INSTALL=0`
# setting turns off, and a contributor carrying that in their own config would otherwise get a
# confusing miss here. The explicit command is unaffected by it.
#
# The hook half writes `hook.hk-*` into `.git/config`, which WORKTREES SHARE — running this from
# one worktree installs hooks for `main` and every sibling. That is right for a fresh clone and
# is why this is an explicit command rather than a `postinstall` that fires behind your back.
# `hk uninstall` reverses it. (`hk install --global`, once per machine, is the alternative that
# never touches repo config and no-ops in repos with no hk.pkl.) Already global? The per-repo
# install detects that, skips, and clears stale local hooks — so this never double-fires.
run = [
   "mise install",
   "mise run hk-install",
]

# The ONE place a WSL leg is spelled. `run_windows` is mise's own platform switch, so no
# task below knows this exists and nothing is duplicated per-platform: on *nix `both` is a
# passthrough, on Windows it runs the task natively and then again under WSL, in series.
# This is what makes a `#[cfg(windows)]`/`#[cfg(unix)]` change trustworthy — each side
# compiles only its own arms, so one platform's green says nothing about the other's.
# Neither leg needs anything spelled here about build output: the root `[env]` block resolves
# CARGO_TARGET_DIR per-leg, so the WSL half lands in its own ext4 cache rather than clobbering
# the Windows half's `spike/target/` over drvfs. It pays a full Linux rebuild the first time.
[tasks.both]
description = "Run a task on BOTH sides, in series — `mise run both test`. Symmetric: from Windows it adds a WSL leg, from inside WSL it adds a Windows leg, and on a real *nix host it just runs the task. Either leg failing fails the run. Each side needs the repo trusted once (`mise trust` there)."
raw = true
usage = 'arg "<task>" var=#true help="the task, plus any of its own args, to run on both platforms"'
run = [
   "mise run {{ usage.task | join(sep=' ') }}",
   # Inside WSL, fan back OUT through interop (`mise.exe` is on the PATH there, and the
   # cwd translates because this tree lives under /mnt/c). Inert on a real *nix host.
   "{% if env.WSL_DISTRO_NAME %}mise.exe run {{ usage.task | join(sep=' ') }}{% else %}true{% endif %}",
]
run_windows = [
   "mise run {{ usage.task | join(sep=' ') }}",
   "wsl -- mise run {{ usage.task | join(sep=' ') }}",
]

[tasks.build]
description = "Build the spike workspace. Force this fresh before trusting any e2e result — the corpus runs whatever binary target/ happens to hold."
raw = true
dir = "spike"
run = "cargo build --workspace"

[tasks.dorc]
description = "Run the product: `mise run dorc -- plan --book=book.sh -o pkg.oracle.sh`. Rebuilds first if stale, so the dev loop always exercises your edit rather than whatever target/ happened to hold. Exit codes are dorc's own (2 usage, 10 parse, the lint family), not cargo's."
raw = true
dir = "spike"
# `-q` matters more than tidiness: dorc's stdout is a CONTRACT (exactly probe-then-apply), so a
# run must be piping-safe. cargo writes progress to stderr and `-q` drops the rest, leaving stdout
# byte-identical to the binary's — `mise run dorc -- apply --book=b.sh > out.sh` is honest.
#
# mise prints `ERROR task failed` for ANY nonzero exit, so a parse-error run (exit 10) reads as a
# tooling failure when it is a legitimate dorc outcome that still shipped its artifact. Read
# dorc's own exit code, not mise's verdict on it.
#
# `raw_args` because this task is a thin proxy for a tool with its own parser: without it mise
# intercepts `--help` and prints ITS task help, so `mise run dorc --help` could never reach dorc's
# own help page — which is a real dorc flag, and a loom-owned one at that.
raw_args = true
run = "cargo run -q -p dorc-cli --bin dorc --"

[tasks.test]
description = "The WHOLE suite, HUMAN-facing: unit tier + the e2e corpus + the loom corpus (the latter two ride the run as harness=false targets). Full per-test output, progress, and context — the interactive mode; agents want `gate:full-quiet` instead. Args filter by trial name. DORC_E2E_QUIET=1 selects the terse per-case format."
raw = true
dir = "spike"
# REMIT: this task optimizes for a human reading a terminal — legibility and context, never
# brevity. Never add quiet flags here to save an agent tokens; that is the `-quiet` half's job,
# and the two exist so neither has to compromise.
#
# The filter is a `usage` arg rather than mise's trailing-args passthrough, because that only
# reaches the LAST command — so `mise run test -- <name>` filtered nextest while every doctest
# still ran. Templating it puts the same filter on both halves.
# `[filter]`, not `<filter>`: angle brackets mark a REQUIRED arg, which makes a bare
# `mise run test` fail with "Missing required arg".
usage = 'arg "[filter]" var=#true help="substring(s) selecting trials; bare runs everything"'
run = [
  "cargo test --workspace --doc {{ usage.filter | join(sep=' ') }}",
  "cargo nextest run --workspace --no-fail-fast {{ usage.filter | join(sep=' ') }}",
]

# Full gate: human output or quiet agent output; both preserve failures.

[tasks."gate:full-quiet"]
description = "ACCEPTANCE, agent-facing: everything `gate:full` runs bar the hook self-test, at minimum token cost — ~95 lines against ~2000. Silent on success, LOUD and complete on failure. The one to run before calling work complete; `mise run both gate:full-quiet` covers the other platform too."
raw = true
dir = "spike"
# REMIT: minimal token burn, and it MUST NOT swallow a failure. Every flag suppresses SUCCESS
# chatter only — `--status-level fail` still prints failing trials, `--failure-output final`
# defers their output rather than dropping it, every step keeps its nonzero exit. A flag that
# could hide a failure does not belong here, whatever it saves. `--no-fail-fast` is the same
# rule: nextest otherwise abandons ~650 trials at the first failure, and "we never ran them" is
# a fact this task may not withhold.
# `test:hooks` is deliberately ABSENT: it exercises hk.pkl, which changes about quarterly, so
# paying for it every agent gate buys nothing. `gate:full` still runs it, and an hk.pkl edit
# calls for that one. Doctests have no quiet knob past cargo's and set the output floor.
run = [
   "mise run preflight gate",
   "hk check --pr --profile full --no-fail-fast --quiet",
   "hk check --staged --profile full --no-fail-fast --quiet",
   "hk check --unstaged --profile full --no-fail-fast --quiet",
]

[tasks."test:e2e"]
description = "The e2e corpus alone: dash -n on both rendered artifacts, exec-under-inert-mocks, crash/empty guard, golden diff, XFAIL/XPASS pins. This runner is the ONLY sanctioned executor of fixture material — never hand-run a book or a rendered artifact. Trailing args: ONE bare substring, or any number of case PATHS."
dir = "spike"
# libtest writes its per-case diagnostics to STDOUT, which an exported `timed` discards
# wholesale — a red run reported `error: test failed` and nothing else. See the
# FAILURE-VISIBILITY CONTRACT above for why this is the only lever that works here.
raw = true
# The trailing `--` is load-bearing: without it mise's passthrough lands on `cargo test`, whose
# own `[TESTNAME]` takes exactly one positional and refuses a second before the runner ever sees
# it. The runner itself resolves any number of case paths (`split_path_selectors`), which is how
# the pre-commit hook scopes a run — so the ceiling was cargo's, not ours.
run = "cargo test -p dorc-cli --test e2e --"

[tasks."test:looms"]
description = "The loom corpus alone: parse + same-slug hygiene + per-case render fixpoint. Trailing args: ONE bare substring, or any number of case PATHS — the same selection test:e2e takes."
dir = "spike"
# Same stdout diagnostics as test:e2e, same swallowed reds, same one lever.
raw = true
# The trailing `--` is load-bearing for the same reason it is on test:e2e: cargo's own `[TESTNAME]`
# takes exactly one positional and refuses a second before the runner sees it.
run = "cargo test -p dorc-cli --test looms --"

# The agent halves of the two corpus tasks. Measured green, both raw: 166 lines for `test:e2e`
# and 276 for `test:looms` unabridged, 9 apiece under `DORC_E2E_QUIET=1` — which selects
# libtest's terse per-case format and leaves every FAILURE printed in full, so the saving is
# passing-case names and nothing else. The bare halves above stay unabridged for a human reading
# a terminal, exactly as the gate matrix's two remits require.

[tasks."test:e2e-quiet"]
description = "The e2e corpus alone, agent-facing: terse per-case format on success, failures unabridged. Takes the same selection test:e2e does."
dir = "spike"
env = { DORC_E2E_QUIET = "1" }
raw = true
# Spelled out rather than composed over `test:e2e`: a nested `mise run` would have to forward the
# path selectors, and mise appends trailing args only to a `run` array's LAST command — which once
# left a two-step publish running over the whole corpus while its git diff was scoped.
run = "cargo test -p dorc-cli --test e2e --"

[tasks."test:looms-quiet"]
description = "The loom corpus alone, agent-facing: terse per-case format on success, failures unabridged. Takes the same selection test:looms does."
dir = "spike"
env = { DORC_E2E_QUIET = "1" }
raw = true
run = "cargo test -p dorc-cli --test looms --"

[tasks."test:real-tools"]
description = "The opt-in real-external-linter lane — the one sanctioned real-invocation path, read-only tools over repo-local fixtures. Off in every default gate. checkbashisms is a perl script Command::new cannot spawn on Windows, so the tool list narrows there; the *nix half provisions it via e2e/lint-real-tools-setup.sh."
raw = true
dir = "spike"
env = { DORC_E2E_REAL_TOOLS = "{% if os() == 'windows' %}shellcheck{% else %}shellcheck,checkbashisms{% endif %}" }
run = "cargo test -p dorc-cli --test e2e"

[tasks."test:floor"]
description = "The opt-in two-binary-floor DIFFERENTIAL (gate-9): every case carrying an expected.emitted section has its STRIPPED book run as a sentinel manifest under each named floor binary, and they must agree with each other and with the committed bytes. Off in every default gate. posh is not in git's Windows userland, so there the lane is dash alone and measures a HALF floor — run it under WSL for the real posh-∩-dash answer."
raw = true
dir = "spike"
env = { DORC_E2E_FLOOR_SHELLS = "{% if os() == 'windows' %}dash{% else %}dash,posh{% endif %}" }
run = "cargo test -p dorc-cli --test e2e"

[tasks.clippy]
description = "Clippy over the workspace with warnings-as-errors — the inner-loop subset of `check`, minus fmt/deny/typos. The -D warnings gate lives in the task, never in the manifest, so mid-work builds don't break on a toolchain bump."
raw = true
dir = "spike"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."clippy:clean"]
description = "Clippy from a WIPED, dedicated target dir — ~7s cold, and unsatisfiable by anything another worktree, branch, or platform left in the shared cache. Rides the `gate:full*` pair; run it alone when you suspect a stale clean."
raw = true
dir = "spike"
# Deliberately redundant with `check`'s clippy, and the redundancy is the point: that one is the
# pre-commit gate (warm, fast, catches the common case), this one is the acceptance check, and it
# holds only because its cache cannot have been touched by another environment. `cargo clean`
# here wipes ONLY the lint dir below, never the shared build cache the rest of the gate needs.
#
# `--quiet` is cargo's, and suppresses build PROGRESS only — verified against a planted lint:
# every diagnostic still prints and the exit stays 101. So it costs the human nothing, and the
# unabridged/quiet split does not need two copies of this task.
run = ["cargo clean", "cargo clippy --workspace --all-targets --quiet -- -D warnings"]

# COMPOSED with the ambient root, never a bare relative path. A relative CARGO_TARGET_DIR
# resolves against the task's cwd, so `target/clippy-clean` always meant `spike/target/…` —
# which on the WSL leg is drvfs, and which `cargo clean` then WIPES on a directory the Windows
# leg is also using. Hanging it off the resolved root keeps each leg's lint dir on its own
# filesystem, and keeps the `cargo clean` inside the dir this task owns.
[tasks."clippy:clean".env]
CARGO_TARGET_DIR = "{{ env.CARGO_TARGET_DIR }}/clippy-clean"

[tasks.check]
description = "All lint gates; pre-commit uses the bounded subset."
raw = true
run = "hk check --all"

[tasks."check-quiet"]
description = "check, agent-facing: `-q` (never `-n` — measured 2026-08-15, --no-progress does not touch hk's per-step-transition text at all when piped, only `--quiet` does). Silent on success (0 bytes); on failure, every diagnostic hk would otherwise show survives — same ERROR block, same diff, same fix command, same exit code — with the step-transition churn (`files - Fetching...`, per-step `❯` pending lines) gone. Never used to swallow a failure, only to drop lines that carried no information a human or an agent transcript needed."
raw = true
run = "hk check --all --quiet"

[tasks.fmt]
description = "Apply the fixers to the spike via hk (cargo fmt, and typos --write-changes). Works in an agent session too: the task re-enables hk's fix mode for itself, since a session-wide HK_FIX=0 would otherwise degrade this to a check that only PRINTS the diff."
raw = true
run = "hk fix --all"

# LOAD-BEARING, do not tidy away. Agent sessions export `HK_FIX=0` so the pre-commit HOOK cannot
# rewrite the tree out from under a running harness — but that also silently turned every step of
# this task into its `check` command, so `mise run fmt` reported a diff and formatted nothing, and
# the standing advice became a hand-derived `cargo fmt` invocation against never-hand-derive.
# Scoping the override to this task keeps the hook check-only while letting an explicit,
# deliberate fix request actually fix.
[tasks.fmt.env]
HK_FIX = "1"

[tasks."gate:full"]
alias = "gate"
description = "ACCEPTANCE, human-facing: everything due before a commit, in order — the four lint gates, the commit-msg hook's self-test, a fresh build, then the whole suite, all unabridged. Agents want `gate:full-quiet`."
raw = true
# REMIT: a human reading a terminal. Never quieten this to save an agent tokens; that is
# `gate:full-quiet`'s entire job, and the pair exists so neither has to compromise.
run = [
  "mise run preflight gate",
  "hk check --pr --profile full --no-fail-fast",
  "hk check --staged --profile full --no-fail-fast",
  "hk check --unstaged --profile full --no-fail-fast",
]

[tasks."gate:step"]
description = "Run one hk gate step over all matching paths."
raw = true
usage = 'arg "step" help="hk step name from the failed gate output"'
run = "hk check --all --profile full --profile arc --step {{ usage.step }} --no-fail-fast"

[tasks."gate:arc"]
description = "CONDUCTOR-ONLY: run completion, arc checks, and RustSec audit."
raw = true
run = [
   "mise run both gate:full-quiet",
   "hk check --pr --profile arc --jobs 1 --no-fail-fast --quiet",
   "hk check --staged --profile arc --jobs 1 --no-fail-fast --quiet",
   "hk check --unstaged --profile arc --jobs 1 --no-fail-fast --quiet",
   "mise run audit",
]

[tasks."test:hooks"]
description = "Self-tests for the hooks hk runs: the commit-msg gate's matchers, and whether pre-commit's `e2e` step still SEES each shape a whole-product case comes in. Cheap; rides `gate` because both checks fail OPEN — a broken matcher stops refusing, and a glob that matches nothing is skipped in silence. The commit-msg hook stays sh (git runs it that way); only the harness is Rust, which is what lets this run from a native Windows shell."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- hook-selftest"

[tasks.preflight]
description = "Bounds-check this machine against a profile's expected disk and RAM usage BEFORE spending either: `mise run preflight gate|bless|kani|lean`. One line on pass, one LOUD line and a nonzero exit on refusal. Rides the heavy tasks automatically (gate:full*, bless*, verify:kani, verify:lean, verify:translate); the hot loop is deliberately unburdened. Each leg checks its OWN environment, so `mise run both preflight gate` is what covers the WSL VM's separate memory cap. DORC_PREFLIGHT=skip bypasses it — emergencies only, and it says so in the output."
raw = true
dir = "spike"
usage = 'arg "<profile>" help="gate, bless, kani, or lean"'
run = "cargo run -q -p internal-tooling -- preflight {{ usage.profile }}"

[tasks.doctor]
description = "READ-ONLY inventory of what is eating the disk: every registered worktree with its size and clean/dirty/locked state, this leg's target dir broken down, and the lane caches. Deletes nothing. ~10s, because the sizes are real directory walks. Each leg sees only its own filesystem — `mise run both doctor` is what shows the WSL lane caches alongside the Windows worktrees."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- doctor"

[tasks."doctor:unused"]
description = "READ-ONLY inventory of what is sitting around UNUSED: every worktree with its clean/dirty and landed state, every local branch with its merged state and whether anything has it checked out, and every lane cache with whether its worktree still exists. Deletes nothing, ever. Sorted, sizeless and timestampless ON PURPOSE — run it at the start and the end of a session and the difference IS that session's residue. Sub-second; `mise run doctor` is the separate, slower question of what is eating the disk. Each leg sees only its own filesystem, so `mise run both doctor:unused` is what puts the WSL caches beside the Windows worktrees."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- doctor unused"

[tasks.clean]
description = "cargo clean over the spike workspace — build artifacts only. Deliberately touches NOTHING in the working tree: no `git clean`, no untracked sweep. Dirty and untracked paths here are routinely a human's in-flight work, and a task that eats them is worth more than it saves."
raw = true
dir = "spike"
run = "cargo clean"

[tasks.audit]
description = "cargo-deny advisories (network: fetches the RustSec DB; not part of the offline pre-commit gates)."
raw = true
run = "cargo deny --manifest-path spike/Cargo.toml check advisories"

[tasks.hk-install]
description = "Install hk's git hooks: the pre-commit lint gate AND the commit-msg gitlabels gate (which refuses AI Co-Authored-By/session trailers). WRITES SHARED .git/config (affects main and every worktree) — human-gated; read the round-19 spike note first. Agent sessions run pre-commit check-only and stash-free (HK_FIX=0 + HK_STASH=none in .claude/settings.json) and get commit-msg in full."
raw = true
# `--mise` wraps the installed hook in `mise x`, which is what lets a contributor who has never
# activated mise in their shell still get the pinned toolchain — and what carries HK_MISE into
# the hook, without which every step's bare `cargo` would be unresolvable.
run = "hk install --mise"

[tasks.bless]
description = "ORCHESTRATOR-ONLY: re-bless goldens after the acceptance gate."
raw = true
dir = "spike"
run = ["mise run preflight bless", "cargo run -q -p internal-tooling -- bless"]

[tasks."bless:dry"]
description = "Builder-safe dry blessing; no golden writes."
raw = true
dir = "spike"
run = ["mise run preflight bless", "cargo run -q -p internal-tooling -- bless --dry"]

[tasks."bless:case"]
description = "The SCOPED re-bless: BLESS=1 over exactly the named cases, and nothing else. `bless` above verifies the WHOLE suite first and refuses while anything is red, which is right for a conductor's close and a deadlock for the one job this exists for — a change that legitimately moves a case's golden cannot bless it while that case is the red one. Same selection `test:e2e` takes (ONE bare substring, or any number of case PATHS), same runner, same gates, and the trial filter is what keeps every other golden byte-identical. Verify the scope yourself afterwards: `git status --short` must show only the cases you named. A case carrying `expected.emitted` is still refused here — that is `bless:floor`'s."
dir = "spike"
raw = true
# The trailing `--` is load-bearing for the reason `test:e2e` records: without it mise's
# passthrough lands on `cargo test`, whose own `[TESTNAME]` takes exactly one positional.
run = "cargo test -p dorc-cli --test e2e --"

[tasks."bless:case".env]
BLESS = "1"

[tasks."bless:floor"]
description = "ORCHESTRATOR-ONLY: the ONE sanctioned way to mint or amend a floor case's `expected.emitted` — the manifest measured under dash AND posh, the transcript, and the book=<sha256> inside it, all written from one run, so nothing is hand-computed. Ordinary `bless` REFUSES such a case by design: expected.emitted is measure-once ground truth (the shells' own answer), never an engine render. Scope it to the case you are minting, exactly like `bless`. Refuses where the pair cannot be resolved — git's Windows userland ships no posh, so run this from WSL. Verifies with the full gate plus `test:floor` afterwards."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- bless --floor"

[tasks."lint:docids"]
description = "READ-ONLY: every docID cross-reference in the corpus, the steering files and the root docs, checked against the document it names. Silent when every target resolves. Matches only the three unambiguous spellings — letter-bearing IDs (28Q, 30Ba), explicit notes//plans/ paths, and colon-slug forms (271:rul-sin-ordering) — because a bare three-digit run is a line number far more often than a docID. Quarantined targets resolve by FILENAME alone; nothing there is opened. Writes nothing, ever."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- docids"

[tasks."prose:census"]
description = "INSTRUMENT, never a gate: per-tier register counts across both generated locks, plus every register marked as written by a person. The burn-down view — migrated text awaits a rewrite, slop is whatever the loom loop minted, and the human column only grows under `dorc-loom publish --human`."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- prose-census"

[tasks."spine:baseline"]
description = "MIGRATION SCAFFOLDING, BUILD-TO-KILL (309 §4): freeze the decision-state smoke-diff baseline over the committed corpus — site-keyed dispositions, guard bindings, custody, survival witnesses, digest. Frozen ONCE at the base commit and re-taken after the Spine lands; the DIFF is a review tool for the fold sitting, never an acceptance gate. The destination is `DORC_SPINE_DUMP=<path>` in the environment — NOT a trailing arg, which libtest would read as a case filter and silently run nothing. Unset, the walk still runs and asserts its floor."
raw = true
dir = "spike"
run = "cargo test -p dorc-cli --test spine_baseline -- --ignored --nocapture"

[tasks."xfail:census"]
description = "INSTRUMENT: every live xfail pin grouped by round horizon, with its greening trigger — 'what is owed, and by when' in one screen. The GATE is the `xfail_census` unit test, which shares this renderer; expiry is measured against xfail.rs's CURRENT_ROUND, which a conductor bumps at round-open."
dir = "spike"
raw = true
run = "cargo run -q -p internal-tooling -- xfail-census"

[tasks.coverage]
description = "INSTRUMENT, never a gate (it cannot fail a build): the analyzer-coverage rollup over the e2e corpus. Needs dorc-coverage built. Pass --full for the per-site table, or a book plus its oracles for a one-off."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- coverage"

# BROKEN as of 2026-07-26, and not by this wiring: the script pipes the raw
# probe-results.txt to dorc, but the round-trip now consumes a framed `dorc-records/1`
# stream that the e2e runner builds by first running the compiled probe
# (`framed_results` in crates/cli/tests/e2e.rs). Every case is refused at intake with
# host-evidence-admission-refused, so the family reads 0.00. Fixing it means porting
# that framing — or, better, moving the measurement into the runner that already has it.
[tasks.yardstick]
description = "INSTRUMENT, never a gate: the strawman24 elision-frequency table. KNOWN-BROKEN — reports NO-SUMMARY for every case (its invocation drifted from the records-lane framing); the failure is loud, not yours. A number here is meaningless unless test:e2e is green anyway."
raw = true
dir = "spike"
run = "sh e2e/yardstick.sh"

# ── verify (the minispec law corpus and its binder) ──────────────────────────────────────────
# `verify:check` is CHEAP and rides the ordinary gate on both platform legs with zero external
# toolchains — a box with no Lean and no aeneas gates green, because those are opt-in lanes that
# are loud only when explicitly asked for.
#
# Everything below `verify:check` is that opt-in lane, and it is LINUX/WSL ONLY: upstream ships
# no Windows aeneas asset. The translator half lives in a NESTED config
# (`spike/verify/aeneas/mise.toml`) because its `rust` pin SHADOWS the workspace compiler; these
# wrappers exist so the nested tasks are reachable from anywhere and so every stable-toolchain
# step stays outside that shadow. Composing by `dir` + a nested `mise run` is the sanctioned
# cross-config idiom (`task-bodies-are-shell-free`).

[tasks."verify:check"]
description = "The binder's CHEAP gate: unit parse, slug discipline, seat-citation resolution, catalogue coherence, the binding two-way agreement, the Generated/ hole census, the byte-budget tripwire, and whether minispec/REPORT.md still matches what the cheap tier renders (engine-tier cells are exempt by construction — they render as not-recomputed-here either way). No Lean, no Kani, no mutants — rides `gate:full-quiet` on both legs."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- check"

[tasks."verify:report"]
description = "Print the generated coverage report and REFUSE if minispec/REPORT.md is stale — the verdict leads, on stderr, and names which cells moved. Cheap tier by default; `-- --with-lean` and `-- --with-kani` recompute those engines' badges (Linux/WSL, slow) and compare against the catalogue instead, `-- --write` republishes the committed copy. `--with-kani` here drives only the harnesses the catalogue PAIRS, not the whole battery — `verify:kani` is the lane for that. `--write --with-lean` is refused: the committed copy is the cheap render, because the cheap gate is what keeps it honest."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- report"

[tasks."verify:promote"]
description = "THE catalogue ceremony: regenerate spike/verify/src/catalogue_lock.rs from the corpus plus the claim inputs you pass, and print every badge movement. Claim inputs are `-- --seat|--proof|--harness <Slug>=<value>` (`=none` withdraws); badge expectations are never declared — a badge is written from evidence THIS run computed, and one whose engine did not run is carried forward untouched, so a cheap promote can neither mint nor withdraw a Lean/Kani claim. Add `-- --with-lean` / `-- --with-kani` (Linux/WSL) to make it recompute those. The lock is compiled in, so republish afterwards with `verify:report -- --write`; review is the git diff of both files."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- promote"

[tasks."verify:translate"]
description = "OPT-IN, Linux/WSL only: regenerate minispec/Generated/ from the real algebra sources through charon+aeneas, then materialize the externals and run the sorry census. STRICT — a construct the translator cannot model is a refusal, never a silent `sorry`. The output is committed, so the diff IS the drift alarm."
raw = true
run = [
   "mise run preflight lean",
   "mise run verify:translate-impl",
   "mise run verify:materialize",
]
run_windows = "wsl -- mise run verify:translate"

[tasks."verify:translate-check"]
description = "Check strict translation output against committed generated files."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- translate-check"
run_windows = "wsl -- mise run verify:translate-check"

[tasks."verify:translate-impl"]
description = "The charon+aeneas half alone, under the nested shadowing toolchain pin. Prefer `verify:translate`, which also materializes and censuses."
raw = true
dir = "spike/verify/aeneas"
run = "mise run aeneas:translate -- {{ config_root }}/minispec/Generated"
run_windows = "wsl -- mise run verify:translate-impl"

[tasks."verify:translate-lenient"]
description = "OPT-IN, Linux/WSL only: enumerate every construct the translator cannot model, in ONE pass, into a scratch dir. This is how the fence in spike/verify/aeneas/Cargo.toml is derived and re-derived. Never a judgement of whether the algebra translated — lenient mode emits SILENT holes."
raw = true
dir = "spike/verify/aeneas"
run = "mise run aeneas:translate-lenient"

[tasks."verify:materialize"]
description = "Turn a raw aeneas emission into the committed tree (move the lib entry, accept the external templates verbatim as axioms) and census it. Fails loud on any proof hole. Runs on the stable toolchain, deliberately outside the nested pin."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- materialize"

[tasks."verify:lean-bootstrap"]
description = "One-time, idempotent: run the elan installer mise fetched, populating ELAN_HOME with elan and its lean/lake proxies. Pulls no toolchain — `verify:lean` triggers that from minispec/lean-toolchain."
raw = true
run = "elan-init -y --no-modify-path --default-toolchain none"

[tasks."verify:kani"]
description = "OPT-IN Linux/WSL Kani verification; Windows routes through WSL."
raw = true
dir = "spike"
run = ["mise run preflight kani", "cargo run -q -p dorc-verify -- kani"]
run_windows = "wsl -- mise run verify:kani"

[tasks."verify:kani-check"]
description = "Check the detached Kani harness with the standard toolchain."
raw = true
run = "cargo check --manifest-path spike/verify/kani/Cargo.toml"

[tasks."verify:kani-setup"]
description = "One-time, idempotent, Linux/WSL only: fetch Kani's engine bundle (CBMC + the kani-compiler, ~1GB into ~/.kani) and the nightly it was linked against (via rustup). Both are Kani's own homes; it offers no env redirect for either. `mise install` provides only the small `cargo-kani` shim — without this, `verify:kani` refuses and names this task."
raw = true
dir = "spike"
run = "cargo run -q -p dorc-verify -- kani --setup"
run_windows = "wsl -- mise run verify:kani-setup"

[tasks."verify:lean"]
description = "OPT-IN, Linux/WSL only: stage minispec/ to an ext4 build root and typecheck it with lake. First run fetches a Lean toolchain and mathlib's olean cache (gigabytes, tens of minutes); later runs are incremental. Staging is load-bearing — lake on drvfs is unusably slow for a dependency store this size."
raw = true
dir = "spike"
run = ["mise run preflight lean", "cargo run -q -p dorc-verify -- lean-build"]
run_windows = "wsl -- mise run verify:lean"

[tasks."verify:lean-badges"]
description = "Recompute Lean badges and compare them with the catalogue."
raw = true
dir = "spike"
run = ["mise run preflight lean", "cargo run -q -p dorc-verify -- report --with-lean"]
run_windows = "wsl -- mise run verify:lean-badges"

# ── livetest ─────────────────────────────────────────────────────────────────────────────────
# NEVER a gate. These four are the only way to reach `spike/e2e/livetest.sh`, and nothing in
# `gate:*`, `bless` or pre-commit reaches them: the lane needs a container runtime, a network, and
# real `apt-get` on a real machine. Routed through `internal-tooling` rather than `sh <script>`
# because a mise task cannot assume a POSIX shell on PATH (see the header note above).

[tasks.livetest]
description = "LIVE ACCEPTANCE, never a gate: provisions a throwaway Debian container with sshd, drives dorc's real plan/apply/re-plan/re-apply loop over real ssh against it, asserts both plan summaries against the hermetic baselines in Research/trial/r26/renders/, and tears it down. ~35s, needs a container runtime (docker/podman/nerdctl/wslc; override with DORC_CONTAINER_CLI). LIVETEST_KEEP=1 leaves the container and the run directory up; a failed run keeps its artifacts either way."
raw = true
dir = "spike"
depends = ["build"]
run = "cargo run -q -p internal-tooling -- livetest run"

[tasks."livetest:baselines"]
description = "Re-derive Research/trial/r26/renders/ — the hermetic baselines `livetest` asserts its live plan summaries against — from the current engine, and print the resulting plan-summary lines. Runs `dorc probe`/`dorc plan` only; executes no book and no oracle bytes. A moved summary is a real engine change: register it in the kit's predictions.md rather than committing it bare."
raw = true
dir = "spike"
depends = ["build"]
run = "cargo run -q -p internal-tooling -- baselines"

[tasks."livetest:target"]
description = "Provision the same container livetest uses and LEAVE IT RUNNING, printing the ssh destination, the per-run key, and a ready-to-paste dorc invocation. The shortcut for poking at a real endpoint by hand; `livetest:clean` removes it."
raw = true
dir = "spike"
depends = ["build"]
run = "cargo run -q -p internal-tooling -- livetest target"

[tasks."livetest:clean"]
description = "Remove every container livetest created, and its run directories. Safe to run at any time; touches nothing it did not create."
raw = true
dir = "spike"
run = "cargo run -q -p internal-tooling -- livetest clean"

[tasks."livetest:remote"]
description = "Drive the livetest loop against a destination YOU supply -- `mise run livetest:remote -- root@host` (or `root@host:2222`). Provisions nothing and tears down nothing, so it will really mutate whatever you point it at. LIVETEST_SSH_KEY names an identity file if your ssh config does not already reach the host."
raw = true
dir = "spike"
depends = ["build"]
run = "cargo run -q -p internal-tooling -- livetest remote"
