# The derived-definitions pipeline: Rust algebra -> LLBC -> Lean, into minispec/Generated/.
#
# NESTED, and one level BELOW `spike/verify/` deliberately. The `rust` pin here is a
# SHADOWING pin (charon is a rustc driver and only runs under the exact nightly it was
# linked against), and mise merges configs cwd-upward — so siting it at `spike/verify/`
# would silently swap the compiler for anyone running cargo from inside the dorc-verify
# crate that lives there. Down here it covers the pipeline and nothing else. (Contrast
# the root config's elan pin, which is purely additive and correctly lives at the root.)
#
# LINUX/WSL ONLY. Upstream publishes no Windows asset for aeneas, so every tool below is
# gated `os = ["linux"]` rather than left to fail at install time. The lane is opt-in:
# nothing in `mise run gate:*` reaches it, and a box with none of this installed gates
# green.
#
# The FENCE — which items are translated, which are axiomatized, and why — lives in this
# directory's `Cargo.toml`, not here: charon reads options from `[package.metadata.charon]`,
# and that is what keeps the fence's patterns out of a shell and in reviewable commented TOML
# (`task-bodies-are-shell-free`).
#
# Reach these through the root config's `verify:*` wrappers, which supply the cwd this file
# needs and keep the stable-toolchain steps out from under the shadowing pin.

[tools]
# ONE pin buys the whole frontend: the aeneas release tarball ships `charon`/
# `charon-driver` at the exact revision aeneas's own `charon-pin` names, so the two
# halves cannot drift the way separate pins would. `minispec/lakefile.toml` requires the
# same revision, so the generated code and the Lean library it imports cannot drift
# either.
"github:AeneasVerif/aeneas" = { version = "nightly-2026.08.13-daa85d7", asset_pattern = "aeneas-linux-x86_64.tar.gz", extract_all = true, os = ["linux"] }

# Dictated, not chosen: verbatim the `rust-toolchain` file inside the charon tarball.
# charon-driver links against this nightly's librustc_driver and `rustc-dev` supplies
# it; `miri` supplies the full-MIR sysroot charon needs to see through std. Bump only
# in lockstep with the pin above.
rust = { version = "nightly-2026-06-01", profile = "minimal", components = "rustc-dev,llvm-tools-preview,rust-src,miri", os = ["linux"] }

[env]
# Build output stays off drvfs and out of the synced tree, and never clobbers the spike
# workspace's shared `spike/target/`.
CARGO_TARGET_DIR = "{{xdg_cache_home}}/dorc-verify-aeneas-target"

# ── Tasks ───────────────────────────────────────────────────────────────────
# No shell syntax in a `run` string, same as the root config. These are *nix-only by
# construction (the tools above are).

[tasks."aeneas:translate"]
description = "Regenerate minispec/Generated/ from the real algebra sources. STRICT: charon fails on any construct it cannot model and aeneas aborts on the first error, because a silently-degraded translation makes the Lean look better than the code is. Root wrapper: `mise run verify:translate`, which also materializes the externals and runs the sorry census."
dir = "{{config_root}}"
usage = 'arg "<destination>" help="output Generated/ directory"'
run = [
   "charon cargo --preset=aeneas --error-on-warnings --dest-file generated.llbc",
   "aeneas -backend lean -no-progress-bar -dest {{ usage.destination }} -split-files -gen-lib-entry -abort-on-error generated.llbc",
]

[tasks."aeneas:translate-lenient"]
description = "translate with the fence and the fail-fast flags OFF — charon downgrades unmodellable constructs to warnings and aeneas keeps going past the first error, emitting a SILENT `sorry` where it gave up. This is how the fence in Cargo.toml is derived and re-derived: it enumerates every blocked item in ONE pass. Never a judgement of whether the algebra translated. Writes to a scratch dir, never to minispec/Generated/."
dir = "{{config_root}}"
run = [
   "charon rustc --preset=aeneas --dest-file lenient.llbc -- --crate-name generated --crate-type=lib --edition=2024 src/lib.rs",
   "aeneas -backend lean -no-progress-bar -dest {{config_root}}/lenient-scratch -split-files lenient.llbc",
]

[tasks."aeneas:check"]
description = "rustc-only sanity pass over the translation unit — proves the sources still compile standalone before blaming charon for rejecting them."
dir = "{{config_root}}"
run = "cargo check --quiet"
