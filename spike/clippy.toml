# Clippy config for the spike workspace.
#
# The workspace lint table (Cargo.toml) turns on the no-panic family
# (unwrap_used/expect_used/panic/indexing_slicing/dbg_macro/print_*) at warn for
# ALL code. The policy comment on those lints says "tests may opt out": tests are
# allowed to panic/unwrap/index/print freely. These keys grant that allowance
# centrally so test code needs no per-item `#[expect]`.
#
# Scope caveat (verified empirically against clippy 0.1.96, refined 2026-08-24):
# these keys suppress the lints in code clippy recognises as a TEST — an inline
# `#[cfg(test)]` module, and a `#[test]`-annotated function anywhere, INCLUDING
# one in a separate integration-test crate under `tests/*.rs`. What they do NOT
# reach is a plain helper `fn` sitting beside those `#[test]` functions in an
# integration-test file: to clippy that is ordinary library code, so a fixture
# builder that unwraps or panics trips the lint while the test calling it does
# not. Do not read a green `#[test]` as proof the file is covered.
#
# The sanctioned answer there is a file-top `#![expect(..., reason = "...")]`
# naming only the lints that actually fire — `#![expect]`, never `#![allow]`
# (`allow_attributes` and `allow_attributes_without_reason` are themselves warn
# lints), and an over-broad list of its own becomes an unfulfilled-expectation
# warning. Rewriting a fixture builder to thread a `Result` through tests that
# must succeed is ceremony, not safety; spend the escape hatch instead.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
