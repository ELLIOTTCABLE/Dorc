# typos config for the spike. Project-vocabulary false positives, each
# pinned as narrowly as the typos regex engine (no lookaround) allows.
[default]
extend-ignore-re = [
   # `fnd-…` is the Research-corpus slug for a finding — the numbered old form (fnd-1,
   # fnd-4) and the full-word form the naming law now requires
   # (fnd-decline-class-is-push-only). Used across the CLAUDE.mds and note
   # cross-references; not a misspelt "find".
   "\\bfnd-[0-9a-z-]+\\b",
   # `mis-` is the English prefix written with a hyphen (mis-chosen, mis-reads,
   # mis-parsing, ...), sentence-initial capital included. Matching only the "mis-" span
   # leaves the suffix word (chosen/reads/...) spell-checked normally; typos otherwise
   # reads "mis" as "miss".
   "\\b[Mm]is-",
   # "the two nevers" is round-23 ruling vocabulary (rul-ternary-verdict's pair of
   # never-clauses; spike/CLAUDE.md + notes/23A) — a plural noun, not a misspelt "never".
   "\\bnevers\\b",
   # DELIBERATE near-miss fixtures of the CLI mode/flag fuzzy-matcher test (`nearest`, cli/main.rs):
   # `aply`/`tust`/`boook` are the one-edit-away typos the suggester must resolve to
   # apply/--risk-faultless-skips/--book. Not misspellings to fix — the test asserts they ARE caught.
   "\\baply\\b",
   "\\btust\\b",
   "\\bboook\\b",
   # `NAMEs` = the plural of the POSIX term NAME (bare munged POSIX NAMEs); typos
   # tokenizes the uppercase-then-`s` as `NAM`+`Es` and mis-flags `NAM`->`NAME`.
   "\\bNAMEs\\b",
   # "unparseable" — the -eable spelling, used across the CLAUDE.mds; typos disputes
   # it for "unparsable" but both are accepted English.
   "\\bunparseable\\b",
   # `book=<hex>` (262 §2 records-lane digest, e2e goldens): a machine-generated FNV
   # hex identifier, not prose — hex runs (a-f) accidentally spell typo-triggers
   # (`ede`, `ba`, ...). Ignore the whole digest token.
   "book=[0-9a-f]+",
   # `Oppen` — Derek Oppen, whose 1980 two-pass prettyprinting algorithm the layout
   # crate cites as the shape its measure/emit split is converging on. A surname,
   # not a misspelt "open".
   "\\bOppen\\b",
   # `<fn>_h<hex>` (`28K` §4 hash-munge disambiguation, apply-artifact goldens): the same
   # machine-generated-hex problem as `book=` above — a digest run spells `hed`, `ba`, `fo`.
   "_h[0-9a-f]{8}\\b",
   # The aeneas release tag pinned by the verify lane: a dated nightly plus the upstream
   # commit's short SHA, whose hex runs accidentally spell typo-triggers (`daa`->`data`).
   # A machine identifier that must match upstream byte-for-byte, not prose.
   "nightly-[0-9.]+-[0-9a-f]+",
   # `digest <hex>` / `digest=<hex>` (the `309` §4 smoke-diff baseline): the same
   # machine-generated-hex problem as `book=` above — a digest run spells `ba`. Dies with the
   # baseline at the fold review.
   "digest[= ][0-9a-f]+",
   # Research-corpus docIDs: a round number plus a lane letter, optionally a sub-lane letter
   # (`28Q`, `27C`, `30Mc`, `30Nd`). Machine identifiers into the corpus, not words — and typos
   # WRITES over some of them in fix mode, which silently breaks a cross-reference the docid lint
   # then reports as dangling (measured: `30Nd` -> `30And`, r30). Keyed on the UPPERCASE letter so
   # ordinal words (`30th`) stay spell-checked.
   "\\b[0-9]{2,3}[A-Z][a-z]?\\b",
]
