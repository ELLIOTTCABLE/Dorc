[package]
name = "dorc-analysis"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The static-analysis engine: a generic monotone-dataflow framework (pure,
# deterministic — `inv-determinism`) plus the sh-specific CFG/effect analyses.
[dependencies]
dorc-core = { path = "../core", version = "0.0.0" }
dorc-aid = { path = "../aid", version = "0.0.0" }
# The CFG builder consumes the parser's arena AST (`cfg::build(ast: &Ast)`), so
# syntax is a real dependency, not dev-only.
dorc-syntax = { path = "../syntax", version = "0.0.0" }
# The effect analysis looks each command's (provider, verb) up in the oracle's
# kind-index to drive the ambient∧invariant reaching-defs gate (note 162 O-1).
dorc-oracle = { path = "../oracle", version = "0.0.0" }

# TEST-ONLY, and NOT product code: the workspace's one `xfail_until` seat and its census live there
# (`30A` §1 d3), so a pin in this crate wears the same registry every other crate's does. The kernel
# gains no dependency and stays `inv-determinism`-clean.
[dev-dependencies]
internal-tooling = { path = "../internal-tooling", version = "0.0.0" }

[lints]
workspace = true
