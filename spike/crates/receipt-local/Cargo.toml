[package]
name = "dorc-receipt-local"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The DEFAULT local durable edge: where a keyset and a receipt store live on one operator's own
# machine, and nothing else.
#
# It stores exact already-signed bytes and supplies already-validated key capabilities. It parses
# no receipt semantically, mints no trusted or complete receipt state, renders no diagnostic,
# inspects no host bytes, and selects no algorithm — every one of those lives in `dorc-receipt`
# or above, so the ordering they depend on is enforced by this crate boundary rather than by call
# order.
#
# The analyzer must never reach it: filesystem and key availability cannot enter an analysis
# decision, so `dorc-core`, `dorc-analysis`, `dorc-plan`, and `dorc-aid` name it nowhere. Only
# `dorc-cli` may, and `crate_fences.rs` checks both directions.
[dependencies]
dorc-receipt = { path = "../receipt", version = "0.0.0" }
# The key documents themselves — generation, parsing, and serialization in the encodings their
# own libraries own. This crate persists what that one produces and decides nothing about what a
# key IS, which is the whole reason the two are separate crates.
dorc-receipt-crypto = { path = "../receipt-crypto", version = "0.0.0" }

[lints]
workspace = true

[[test]]
name = "manifest"
path = "tests/manifest.rs"

[[test]]
name = "names"
path = "tests/names.rs"

[[test]]
name = "crate_fences"
path = "tests/crate_fences.rs"

[[test]]
name = "io_model"
path = "tests/io_model.rs"

[[test]]
name = "keyset_sweep"
path = "tests/keyset_sweep.rs"

[[test]]
name = "native_keyset"
path = "tests/native_keyset.rs"

[[test]]
name = "store_sweep"
path = "tests/store_sweep.rs"

[[test]]
name = "native_store"
path = "tests/native_store.rs"

# Two things `std` will not answer, both load-bearing here.
#
# `process`: the effective user's own identity. `std` answers a file's owner and never the
# process's, and the ownership comparison needs both.
#
# `fs`: handle-relative, non-following filesystem acts. `std::fs::OpenOptions` always follows the
# final component, so a redirect check followed by an ordinary open is a name check with a swap
# window between it and the object — which is precisely what an operation called
# `OpenExistingNoFollow` must not be. `openat`/`mkdirat`/`unlinkat` plus `O_NOFOLLOW` close it,
# and let an act be performed against a retained directory handle rather than re-walked by name.
#
# Unix only: Windows has no comparable answer to either question and says so, which is the
# explicitly weaker baseline `30Rd` describes. Safe API both times, so `unsafe` stays forbidden
# workspace-wide.
#
# `std` is named because the handles crossing this seam are `std::fs::File`s: without it the
# package uses its own polyfilled descriptor types and every `openat` here would need a
# conversion nobody can write safely. It is a feature of a package already in the graph, never a
# new dependency.
#
# Exact-pinned (wildcards = deny) and already in this workspace's graph, so this edge adds no
# package. `default-features = false` keeps it to those three: no net, no unrelated surfaces.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = [
  "fs",
  "process",
  "std",
] }
