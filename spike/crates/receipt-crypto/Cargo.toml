[package]
name = "dorc-receipt-crypto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The implementations of `dorc-receipt`'s injected capability traits, and NOTHING else.
#
# This crate exists so the RNG these packages carry cannot reach the analyzer kernel: only
# `dorc-cli` depends on it, and `dorc-plan` depends on the pure crate alone. That one edge is
# DEV-ONLY for now — the write route takes injected capabilities and links no implementation, so
# the shipped binary cannot sign a document; the edge becomes ordinary when a key provider lands.
# It mints no checked, trusted, or complete receipt state — those constructors live in
# `dorc-receipt` and are unreachable from here, so verify-before-interpret is enforced by the
# crate boundary rather than by call ordering.
#
# Feature discipline: `age`'s `armor` is NOT a default feature and the grammar requires
# canonical ASCII armor, so it is named explicitly. `plugin`, `ssh`, `async`, `cli-common`
# and `unstable` stay off; `ed25519-dalek` takes no key generation, serde, batch, prehash,
# or hazardous surface.
#
# `pkcs8` is what makes the private signing document the LIBRARY's encoding rather than one
# this project invented, and `zeroize` — off by default once `default-features` is — is what
# gives the in-memory key its erase-on-drop. `pem` stays off: the stored document is DER, and
# a second textual encoding would be a second thing a reader might accept.
[dependencies]
dorc-receipt = { path = "../receipt", version = "0.0.0" }
age = { version = "=0.12.1", default-features = false, features = ["armor"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
   "std",
   "pkcs8",
   "zeroize",
] }
# For the stack buffer a generated secret passes through on its way into a key. Already in the
# graph beneath both packages above, so this line adds an edge and no package.
zeroize = { version = "=1.9.0", default-features = false }

[lints]
workspace = true
