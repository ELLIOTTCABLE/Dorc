[package]
name = "dorc-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
# The `tests/` dir holds case DATA (dirs and `.loom` files) beside its two runners, so
# target discovery is declared, never inferred (`288:rul-flat-test-tree`).
autotests = false

# The thin driver — the one place (with `hostsim`) where real I/O lives. The
# analyzer kernel it calls is pure (`inv-determinism`); this binary just reads
# files, runs the pipeline, and prints the plan.
[[bin]]
name = "dorc"
path = "src/main.rs"

# `dorc-sh` — the strip-and-exec shebang runner the `#!/usr/bin/env dorc-sh` corpus stamp names
# (`27D` rider-dorc-sh-unbuilt / `24P` §9 decision-dorc-sh-semantics). A thin second bin sharing the
# workspace parsing crates (the "ubi-friendly standalone cleaner" is `dorc strip`; this is its
# runtime sibling). Strip-if-marked, then run under stock sh.
[[bin]]
name = "dorc-sh"
path = "src/bin/dorc-sh.rs"

# The INTERNAL invocation-surface lib (`289:rul-worldless-route-honest-trigger`): a loom-harness
# seam so a defining case for an invocation error can fire the REAL parser instead of decorating a
# payload. Never a public API — the crate is `publish = false`.
[lib]
name = "dorc_cli"
path = "src/lib.rs"

[dependencies]
dorc-core = { path = "../core", version = "0.0.0" }
dorc-aid = { path = "../aid", version = "0.0.0" }
dorc-syntax = { path = "../syntax", version = "0.0.0" }
dorc-analysis = { path = "../analysis", version = "0.0.0" }
dorc-oracle = { path = "../oracle", version = "0.0.0" }
dorc-plan = { path = "../plan", version = "0.0.0" }
dorc-lint = { path = "../lint", version = "0.0.0" }

# The durable receipt family's PURE half — recorded models, grammar, identities. `sha2` only, a
# function of its input bytes, so naming it here moves no nondeterminism to this edge. The
# implementation crate carrying the randomness is a separate dependency under its own allow-list.
dorc-receipt = { path = "../receipt", version = "0.0.0" }

# The capability IMPLEMENTATIONS, and the local durable edge that persists what they produce.
# PRODUCTION dependencies since the shipped binary writes and reads its own receipts: the crypto
# crate is what signs and seals a document, and the local edge is where the keyset and the store
# live. Naming either is a governed act — `receipt/tests/crate_boundary.rs` allow-lists the crates
# that may name the crypto one, and `receipt-local/tests/crate_fences.rs` does the same for this
# one, both two-way, so these lines and those entries move together.
dorc-receipt-crypto = { path = "../receipt-crypto", version = "0.0.0" }
dorc-receipt-local = { path = "../receipt-local", version = "0.0.0" }

# The controller<->host session edge (`260` §2). Depends on std alone, so nothing about
# reaching a host can leak a dependency inward past this crate.
dorc-transport = { path = "../transport", version = "0.0.0" }

# The layout engine the why surface renders through. It sits RENDER-side of the firewall
# (`28E:rul-tree-render-is-a-firewalled-crate`): this edge and `dorc-aid` may depend on it, and
# `core`/`analysis`/`plan` may never — a decision must not be able to learn what its output looks
# like. Zero dependencies, and a pure function of (tree, frame).
weft = { path = "../weft", version = "0.0.0" }

# ack-5 (deps are fine OUTSIDE the DST kernel — "boring UI crap is exactly where dependencies
# buy the most"): the CLI EDGE ONLY. anstream/anstyle give stderr severity color with correct
# Windows VT handling + isatty auto-detection + NO_COLOR — plain-when-piped is load-bearing for
# golden-safety (the e2e harness captures stderr to a file ⇒ non-tty ⇒ color auto-stripped). The
# KERNEL crates stay dependency-clean (inv-determinism unmoved). Exact-pinned (wildcards=deny).
anstream = "=0.6.18"
anstyle = "=1.0.10"

# The operating system's randomness, for the ONE thing this binary mints that must be
# collision-resistant rather than merely unique-per-attempt: a receipt identity. Named here and
# read at exactly one seat (`receipt_edge::OsReceiptIdSource`), which is the edge
# `inv-determinism` allows real I/O at; every kernel and every test takes an injected source
# instead. Already in the graph beneath the crypto crate, so this line adds an edge and no
# package. Exact-pinned (wildcards = deny).
getrandom = "=0.2.17"

# The two central case runners (`288` §3). They are `harness = false` because a corpus
# case is DATA, not a `#[test]` fn: libtest-mimic turns each discovered case into one
# named, filterable trial while keeping the ordinary `cargo test` CLI. Test-only, and
# pinned to the 0.8.1 line, which shares the workspace's existing anstream/anstyle
# rather than pulling a second major (`cargo deny check bans`).
[dev-dependencies]
libtest-mimic = "=0.8.1"
# The repo's cross-platform tooling crate (NOT product code). The corpus needs a POSIX
# shell to `-n` and execute rendered artifacts; this is the one place that answers where
# one is, shared with the mise tasks so they cannot drift apart.
internal-tooling = { path = "../internal-tooling", version = "0.0.0" }
# The loom runner replays each case through the SAME production consumer the loom
# toolchain uses. `dorc-loom` deps this crate's internal lib seam
# (`289:rul-worldless-route-honest-trigger`), so this edge is a dev-only cycle — cargo
# resolves it, and no non-test build sees it.
dorc-loom = { path = "../dorc-loom", version = "0.0.0" }
errorloom = { path = "../errorloom", version = "0.0.0" }

[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false

[[test]]
name = "looms"
path = "tests/looms.rs"
harness = false

# The definition-factoring battery (`28Q` §1). An ordinary-harness `.rs` test, not a case
# collection — it READS the committed corpus (dir cases and loom sections alike) and asserts
# properties of the analysis over it, so it mints no trial per case and needs no runner.
[[test]]
name = "definition_frames"
path = "tests/definition_frames.rs"

# The sh-parity battery's pipeline tier (`30A`). Ordinary-harness, like `definition_frames`: it
# drives whole worlds through the real pipeline to ask whether a linguistic behaviour cost a site
# its LICENSE, which no single-crate assertion can answer.
[[test]]
name = "receipt_route"
path = "tests/receipt_route.rs"

# The production durable route, across process boundaries. Ordinary-harness: it drives the SHIPPED
# binary in a throwaway per-user profile and asks what the binary itself wrote, which is the one
# claim no in-process battery can make.
[[test]]
name = "durable_route"
path = "tests/durable_route.rs"

[[test]]
name = "sh_parity"
path = "tests/sh_parity.rs"

# The shared-region ARTIFACT battery (`plans/30L` §8/§11). Ordinary-harness, like
# `definition_frames`: it reads the committed round-trip goldens and asserts structure over the
# emitted bytes, because "no cloned helper, no generated dispatch, no per-call specialization" is a
# claim only the artifact can answer.
[[test]]
name = "region_artifacts"
path = "tests/region_artifacts.rs"

# MIGRATION SCAFFOLDING, BUILD-TO-KILL (`309` §4): the decision-state smoke-diff baseline. Its one
# trial is `#[ignore]`d and driven by `mise run spine:baseline`, so it costs the suite nothing while
# still compiling with it. DELETE this stanza and its file at the fold review.
[[test]]
name = "spine_baseline"
path = "tests/spine_baseline.rs"

[lints]
workspace = true
