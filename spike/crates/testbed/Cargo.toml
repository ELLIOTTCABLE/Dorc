[package]
name = "dorc-testbed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The suite's shared SUBSTRATE — seats that product-crate tests, both `harness = false` runners, and
# the loom driver all reach, sitting BELOW `cli` so every one of them can depend on it without a
# cycle. NOT part of Dorc, and deliberately dependency-free (std only): a dep here would leak into
# every consumer's test build. This is where "one seat, reached everywhere" lives, the answer to the
# question `internal-tooling` cannot be (that crate is the xtask BINARY's plumbing and is meant to
# have no dependents).
#
# Tenants today: the run-seed seat (`run_seed`); the seam-variable vocabulary (`seam_vars`, the
# `DORC_SEED`/`DORC_SEAM_*` names — `cli::seam` owns the PARSER and its value grammar and imports
# these names); and the xfail-pin seat with its census (`xfail`) plus the `repo_root` its corpus
# walk resolves from — moved out of `internal-tooling` so that crate keeps no dependents. Charter
# tenants NOT yet moved here: the seeded LCG (`cli::seam::SeamLcg` and `hostsim::Lcg` are
# byte-identical today — same `6_364_136_223_846_793_005` / `1_442_695_040_888_963_407` constants —
# so one home is owed); and the scratch/sandbox guard the suite mints in many copies.

[lib]
name = "dorc_testbed"
path = "src/lib.rs"

[lints]
workspace = true
