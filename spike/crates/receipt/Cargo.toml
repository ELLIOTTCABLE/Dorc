[package]
name = "dorc-receipt"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# The durable receipt family: recorded models, the exact `dorc-receipt/1` grammar,
# identities, limits, projections, the reverse-overlay validator, DSSE PAE, and the
# reader/writer states.
#
# DETERMINISTIC. `sha2` is the only dependency and the only edge this crate carries into
# `dorc-plan`, which is the last kernel stage: it is a pure function of its input bytes,
# reads no clock, no environment, and no OS randomness, so `inv-determinism` is unmoved.
# Every nondeterministic capability — signing, sealing, opening, id minting, publication —
# is a TRAIT here and an implementation in `dorc-receipt-crypto`, which this crate must
# never depend on. That direction is what keeps the RNG `age` carries out of the kernel's
# dependency graph entirely (root `AGENTS.md`: correctness-critical kernels stay clean of
# nondeterministic deps).
[dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
