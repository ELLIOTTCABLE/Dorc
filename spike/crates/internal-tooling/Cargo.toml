[package]
name = "internal-tooling"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# NOT PART OF DORC. This crate is repo plumbing — the cross-platform home for work that
# used to be `sh` scripts under `.githooks/`, `e2e/`, and `tools/`. Nothing in the product
# links it; it exists so `mise run gate` needs no POSIX shell on the developer's PATH.
#
# It is the `cargo-xtask` pattern: automation that bootstraps from cargo and rustc alone,
# and that is cross-platform BECAUSE it does not go through a shell. It runs from the
# `tooling` profile's own directory, so no workspace build can relink it mid-run; a dep here is
# judged on disk and cold-build cost (`sysinfo` was measured at ~150 MiB of rlib per target dir,
# `libwindows.rlib` alone 62 — self-defeating in a crate whose job includes guarding disk).
[[bin]]
name = "internal-tooling"
path = "src/main.rs"

[lib]
name = "internal_tooling"
path = "src/lib.rs"

# Two std-only, dependency-free workspace path crates — neither re-imports a platform assumption
# nor costs real disk, so the dependency bar above is met. `dorc-testbed` carries the xfail-pin
# seat and `repo_root`; `dorc-transport` carries the POSIX-shell seat (`one-shell-answer`,
# `Posix`/`which`). This crate's plumbing consumes both leaves; neither ever consumes it.
[dependencies]
dorc-testbed = { path = "../testbed", version = "0.0.0" }
dorc-transport = { path = "../transport", version = "0.0.0" }
# `assay` lexes book lines with the product's own lexer (`notes/30Y` § 2.2).
dorc-syntax = { path = "../syntax", version = "0.0.0" }

[lints]
workspace = true

# TEST-ONLY, and dev-dependencies on purpose: the harness-exclusion test parses `cargo metadata`
# (JSON) and the root `mise.toml` (TOML). Dev-deps never link into the xtask binary a bless run
# drives (`300:finding-bless-driver-self-lock-on-windows`). `toml` is the 0.5 line already locked
# transitively; `serde_json` is the one new source (conductor-ruled, `cargo deny` permitting).
[dev-dependencies]
serde_json = "1"
toml = "0.5"

# UNIX ONLY, deliberately. Free-space-on-this-volume, which std does not offer and
# `unsafe_code = "forbid"` bars us from asking the OS for directly; on Linux it reaches `rustix`
# (~14 MiB of rlib) and file locking is default-off, so only the `statvfs` half is used.
#
# Windows answers the same question through the native-query family the RAM probe already uses.
# A Windows dep is no longer barred by feature unification relinking a running binary
# (`300:finding-bless-driver-self-lock-on-windows`): the `tooling` profile retired that. It is
# judged, like any dep here, on disk and cold-build cost.
[target.'cfg(unix)'.dependencies]
fs4 = { version = "1.1.0", default-features = false }
