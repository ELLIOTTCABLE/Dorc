[package]
name = "internal-tooling"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# NOT PART OF DORC. This crate is repo plumbing — the cross-platform home for work that
# used to be `sh` scripts under `.githooks/`, `e2e/`, and `tools/`. Nothing in the product
# links it; it exists so `mise run gate` needs no POSIX shell on the developer's PATH.
#
# It is the `cargo-xtask` pattern: automation that bootstraps from cargo and rustc alone,
# and that is cross-platform BECAUSE it does not go through a shell. The dependency bar is
# correspondingly high: a dep here must DELETE a platform assumption, never re-import one,
# and must not cost real disk (`sysinfo` was measured at ~150 MiB of rlib per target dir,
# `libwindows.rlib` alone 62 — self-defeating in a crate whose job includes guarding disk).
[[bin]]
name = "internal-tooling"
path = "src/main.rs"

[lib]
name = "internal_tooling"
path = "src/lib.rs"

[lints]
workspace = true

# UNIX ONLY, deliberately. Free-space-on-this-volume, which std does not offer and
# `unsafe_code = "forbid"` bars us from asking the OS for directly; on Linux it reaches `rustix`
# (~14 MiB of rlib) and file locking is default-off, so only the `statvfs` half is used.
#
# Windows answers the same question through the native-query family the RAM probe already uses,
# because a dep THERE is not free: `windows-sys` is shared with other workspace members, so its
# features unify differently for `-p internal-tooling` than for `--workspace`, this crate's
# fingerprint diverges between the two, and every workspace build re-uplifts a binary that a
# bless run is executing (`300:finding-bless-driver-self-lock-on-windows`). Dependency-freedom
# here is load-bearing, not aesthetic — keep this table empty on Windows.
[target.'cfg(unix)'.dependencies]
fs4 = { version = "1.1.0", default-features = false }
