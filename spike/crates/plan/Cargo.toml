[package]
name = "dorc-plan"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
# Target discovery is declared, never inferred — the `crates/cli` precedent
# (`288:rul-flat-test-tree`), here for the other half of the same rule: SyncThing drops
# `*.sync-conflict-*.rs` copies into this tree, and cargo's autodiscovery is a corpus walk that
# does not skip them (`sync-residue-is-never-a-case`). Autodiscovered, such a copy becomes a test
# target whose name is not a legal crate identifier, which fails the workspace lint gate and so
# blocks every commit in the tree until a human clears the residue.
autotests = false

# The elision path: turn (analysis `SkipClass` + a host probe verdict) into a
# plan, gated by the note-165 orientation locks. Consumes the analysis result and
# the oracle grade; the host verdict is injected (the real host / `hostsim` is a
# later seam), so this crate stays a pure, deterministic function of its inputs.
[dependencies]
dorc-core = { path = "../core", version = "0.0.0" }
dorc-aid = { path = "../aid", version = "0.0.0" }
dorc-analysis = { path = "../analysis", version = "0.0.0" }
# Rendering a leaf back to sh resolves its source span out of the AST.
dorc-syntax = { path = "../syntax", version = "0.0.0" }
# The probe-wrapper funcname mapping (`to_funcname_segment`) is shared with the
# oracle lift's `<provider>__predict` funcname mangling — one home for the
# hyphen↔underscore convention (task-P). The e2e tests also build a kind-index.
dorc-oracle = { path = "../oracle", version = "0.0.0" }
# The independent reference model of the sparing algebra (`300:lane-sparing-rederivation`). Zero
# deps, one pass, authored blind to this crate: every survival verdict re-derives through it before
# a plan ships, and the differential drives both implementations over the same inputs.
dorc-sparing-reference = { path = "../sparing-reference", version = "0.1.0" }
# The durable receipt family. Pure (`sha2` only, a function of its input bytes), which is what
# lets the last kernel stage depend on it without moving `inv-determinism`.
dorc-receipt = { path = "../receipt", version = "0.0.0" }

# TEST-ONLY, and deliberately so: the kernel gains no dependency. `render_corpus`'s
# `dash -n` net needs a POSIX shell, and `internal-tooling` (std-only repo plumbing, not
# product code) is the one place that answers where one is — shared with the e2e runner so
# the two cannot drift into disagreeing about it, as they silently had.
[dev-dependencies]
# Also the workspace's one `xfail_until` seat and its census (`30A` §1 d3) — test-only, NOT product.
internal-tooling = { path = "../internal-tooling", version = "0.0.0" }
# TEST-ONLY: `hostsim::Lcg` is the spike's single home of seeded entropy (`inv-determinism`), and
# the sparing differential draws its permuted inputs from it rather than minting a third LCG. The
# edge is dev-only in both directions (hostsim's own tests dev-dep this crate), so no lib-graph
# cycle exists.
dorc-hostsim = { path = "../hostsim", version = "0.0.0" }

[[test]]
name = "erasability"
path = "tests/erasability.rs"

[[test]]
name = "observable_matrix"
path = "tests/observable_matrix.rs"

[[test]]
name = "render_corpus"
path = "tests/render_corpus.rs"

[[test]]
name = "sparing_differential"
path = "tests/sparing_differential.rs"

[[test]]
name = "region"
path = "tests/region.rs"

[[test]]
name = "env_identity_pins"
path = "tests/env_identity_pins.rs"

[lints]
workspace = true

[[test]]
name = "receipt_projection"
path = "tests/receipt_projection.rs"
