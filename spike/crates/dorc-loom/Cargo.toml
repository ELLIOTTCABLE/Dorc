[package]
name = "dorc-loom"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[[bin]]
name = "dorc-loom"
path = "src/bin/dorc-loom.rs"

# The Dorc↔errorloom adapter (`282` §4 · `28A` §1). dorc-aid OWNS its tagged-span
# vocabulary and takes NO dependency on errorloom (kernel-dep-cleanliness); THIS
# crate is the ordinary consumer shape — it maps an aid-owned tagged render onto
# errorloom's generic span schema and proves the gap-free total cover through
# `errorloom::TaggedRender::new`. Both deps are path-local, publish=false.
[dependencies]
dorc-core = { path = "../core", version = "0.0.0" }
dorc-aid = { path = "../aid", version = "0.0.0" }
errorloom = { path = "../errorloom", version = "0.0.0" }
# World-as-pipeline (`283:dec-world-two-forms` · `28A` §2n): the marker pilot fires the REAL in-process
# marker gate over an in-memory source; the cmdsub flagship fires the REAL analysis pipeline (parse →
# cfg → value → classify) over a book. All are kernel-pure (`inv-determinism`) — DST-clean, no I/O.
dorc-oracle = { path = "../oracle", version = "0.0.0" }
dorc-syntax = { path = "../syntax", version = "0.0.0" }
dorc-analysis = { path = "../analysis", version = "0.0.0" }
dorc-plan = { path = "../plan", version = "0.0.0" }
dorc-lint = { path = "../lint", version = "0.0.0" }
dorc-transport = { path = "../transport", version = "0.0.0" }
# The INTERNAL cli lib (`289:rul-worldless-route-honest-trigger`): the loom fires the REAL argument
# parser so an invocation-error case is honest, not decorative. `cli` does not dep `dorc-loom`, so
# there is no cycle.
dorc-cli = { path = "../cli", version = "0.0.0" }
# The typed durable-write outcomes an injected edge names (`edge_fault`). The PURE receipt crate:
# no filesystem, no provider, no algorithms — those are its crypto/local siblings, and neither is
# reachable from here.
dorc-receipt = { path = "../receipt", version = "0.0.0" }
# The ONE argv grammar, shared by the binary and by the in-loom driver (`30C:rul-this-is-a-global-flag`).
# Two hand-written parsers over one surface is how a transcript and a terminal come to disagree about
# where a flag may sit. Already in the workspace lock behind `libtest-mimic`, so this adds no package;
# `dorc-loom` is authoring tooling, outside both DST fences (`inv-determinism`, `aid-is-dst-clean`), and
# `aid`'s edge on this crate is dev-only, so nothing reachable from a production path gains a dependency.
clap = { version = "4.5.60", features = ["derive"] }
# Diagnostics go to STDERR and stdout carries only what a reader or a pipe is meant to parse
# (`30C` item 3). `tracing` over `log` on the human's lean: the project expects tracing elsewhere
# eventually, and one facade is cheaper than two. Both are trimmed to the smallest feature set that
# still emits — no `#[instrument]` proc-macro, no ANSI, no `log` bridge — because the whole ask is a
# stream split and a per-line attribution leader, not an observability stack.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[dev-dependencies]
# The chrome-LINE round-trip proves the WHOLE chain (`28H` ruling 3): a laid-out render, its span
# map, the part stream, the section, the edit, the entry. Driving the real layout engine is the
# only way to exercise the wrap the transport has to survive.
weft = { path = "../weft", version = "0.0.0" }

