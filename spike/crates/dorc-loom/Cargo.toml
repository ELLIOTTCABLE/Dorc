[package]
name = "dorc-loom"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dorc-loom"
path = "src/bin/dorc-loom.rs"

# The Dorc↔errorloom adapter (`282` §4 · `28A` §1). dorc-core OWNS its tagged-span
# vocabulary and takes NO dependency on errorloom (kernel-dep-cleanliness); THIS
# crate is the ordinary consumer shape — it maps a core-owned tagged render onto
# errorloom's generic span schema and proves the gap-free total cover through
# `errorloom::TaggedRender::new`. Both deps are path-local, publish=false.
[dependencies]
dorc-core = { path = "../core", version = "0.0.0" }
errorloom = { path = "../errorloom", version = "0.0.0" }
# World-as-pipeline (`283:dec-world-two-forms` · `28A` §2n): the marker pilot fires the REAL in-process
# marker gate over an in-memory source; the cmdsub flagship fires the REAL analysis pipeline (parse →
# cfg → value → classify) over a book. All are kernel-pure (`inv-determinism`) — DST-clean, no I/O.
dorc-oracle = { path = "../oracle", version = "0.0.0" }
dorc-syntax = { path = "../syntax", version = "0.0.0" }
dorc-analysis = { path = "../analysis", version = "0.0.0" }
dorc-plan = { path = "../plan", version = "0.0.0" }
dorc-lint = { path = "../lint", version = "0.0.0" }

[lints]
workspace = true
