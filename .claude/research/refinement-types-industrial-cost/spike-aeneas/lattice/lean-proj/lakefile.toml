name = "LatticeProbe"
defaultTargets = ["Lattice", "Laws"]

# The SAME release the `aeneas` binary came from — one pin, two consumers, so the
# generated code and the library it imports cannot drift.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "nightly-2026.08.13-daa85d7"
subDir = "backends/lean"

[[lean_lib]]
name = "Lattice"

# Hand-written, and the whole point: whether the LAWS can be stated against the
# extraction. Kept a separate root so `lean:emit` can overwrite `Lattice.lean`.
[[lean_lib]]
name = "Laws"
